[project]
name = "heatsplat"
version = "0.1.0"
description = "3D thermal building scans with Gaussian splatting: find, rank, and price heat leaks."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/heatsplat"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "backend/tests"]
pythonpath = ["pipeline", "backend"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]
